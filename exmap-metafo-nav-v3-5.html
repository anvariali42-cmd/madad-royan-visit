const get = id=>document.getElementById(id);
const content = get('page-content');
const sheet = get('sheet');
const canvas = sheet.querySelector('canvas');
const documents = [];
const repositoryFiles = 'https://raw.githubusercontent.com/anvariali42-cmd/madad-royan-visit/main/';
const hosted = location.protocol === 'https:' || location.protocol === 'http:';
let revision = 0;
let renderTask;
let displayedPage;
let canGoBack = false;
const library = import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.mjs').then(pdfjs=>{
  pdfjs.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/legacy/build/pdf.worker.mjs';
  return pdfjs;
});
function getPagerLinks(links, page){
  // Match the pager rectangles in the source PDF, including their destinations.
  return links.filter(([x,y,w,h,target]) =>
    Math.abs(y-86/555*100)<.1 && Math.abs(w-75/315*100)<.1 && Math.abs(h-19/555*100)<.1 &&
    ((Math.abs(x-17/315*100)<.1 && target===page-1) ||
     (Math.abs(x-107/315*100)<.1 && target===page+1)));
}

function updatePageControls(pagerLinks, part, page){
  get('page-controls').hidden = pagerLinks.length===0;
  for(const [id,offset] of [['page-prev',-1],['page-next',1]]){
    const anchor = get(id);
    const target = pagerLinks.find(link=>link[4]===page+offset);
    if(target) anchor.href = '#'+part+'/'+target[4];
    else anchor.removeAttribute('href');
    anchor.setAttribute('aria-disabled',String(!target));
  }
}

async function draw(){
  const token=++revision;
  if(renderTask) renderTask.cancel();
  const match=location.hash.match(/^#([12])\/(\d+)$/);
  const part=match?Number(match[1]):1;
  const map=maps[part-1];
  const page=Math.max(1,Math.min(map.length,match?Number(match[2]):1));
  const pdfName = 'exmap-part-'+part+'.pdf';
  const downloadUrl = repositoryFiles+pdfName;
  const pdfUrl = hosted ? new URL(pdfName, location.href).href : downloadUrl;
  get('pdf').href = pdfUrl;
  get('one').setAttribute('aria-current',String(part===1));
  get('two').setAttribute('aria-current',String(part===2));
  get('counter').textContent=page.toLocaleString('fa-IR')+' از '+map.length.toLocaleString('fa-IR');
  const links = map[page-1];
  const pagerLinks = getPagerLinks(links, page);
  const keepPosition = displayedPage?.part === part &&
    displayedPage.pagerLinks.some(link=>link[4]===page);

  if(!keepPosition){
    displayedPage=undefined;
    get('status').textContent='در حال بارگیری نقشه…';
    sheet.hidden=true;
    get('metas').hidden=true;
    updatePageControls(pagerLinks, part, page);
  }
  try{
    const pdfjs=await library;
    if(token!==revision) return;
    documents[part-1]??=pdfjs.getDocument({url:pdfUrl}).promise.catch(error=>{
      documents[part-1]=undefined;
      throw error;
    });
    const pdf=await documents[part-1];
    const source=await pdf.getPage(page);
    if(token!==revision) return;
    const viewport=source.getViewport({scale:3});
    const pageCanvas=document.createElement('canvas');
    pageCanvas.width=Math.ceil(viewport.width);pageCanvas.height=Math.ceil(viewport.height);
    renderTask=source.render({canvasContext:pageCanvas.getContext('2d'),viewport});
    await renderTask.promise;
    if(token!==revision) return;
    canvas.width=pageCanvas.width;canvas.height=pageCanvas.height;
    canvas.getContext('2d').drawImage(pageCanvas,0,0);
    get('links').replaceChildren(...links.map(linkData=>{
      const [x,y,w,h,target] = linkData;
      if(pagerLinks.includes(linkData)){
        const cover=document.createElement('span');
        cover.className='pager-cover';
        Object.assign(cover.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'});
        return cover;
      }
      const link=document.createElement('a');
      link.className='hotspot';
      link.href='#'+part+'/'+target;
      link.setAttribute('aria-label','رفتن به صفحهٔ '+target.toLocaleString('fa-IR'));
      Object.assign(link.style,{left:x+'%',top:y+'%',width:w+'%',height:h+'%'});
      return link;
    }));
    get('status').textContent='';
    sheet.hidden=false;
    get('metas-entry').hidden=page!==1;
    get('metas').hidden=page!==1;
    displayedPage={part,pagerLinks};
    updatePageControls(pagerLinks, part, page);
    content.scrollTop=0;
  }catch(error){
    if(token===revision){
      displayedPage=undefined;
      sheet.hidden=true;
      get('metas').hidden=true;
      updatePageControls(pagerLinks, part, page);
      get('pdf').href=downloadUrl;
      get('status').textContent='نقشه در این مرورگر باز نشد. برای دریافت فایل از گیت‌هاب، «PDF اصلی» را بزنید.';
    }
  }
}
for(const container of [get('links'),get('one'),get('two'),get('page-controls')]) container.addEventListener('click',event=>{
  const link=event.target.closest('a');
  if(link && link.hash!==location.hash){canGoBack=true;get('back').disabled=false;}
});
get('back').onclick=()=>{if(canGoBack) history.back();};
get('metas-entry').onclick=event=>{event.preventDefault();get('metas').scrollIntoView();};
history.scrollRestoration='manual';
window.addEventListener('hashchange',draw);
if(!location.hash) history.replaceState(null,'','#1/1');
draw();
</script>
